name: Build Electron VST3 Plugin

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'examples/demo-plugin/**'
      - '.github/workflows/build-electron-vst3.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact: ReAudio-*.AppImage
            name: linux
          - os: windows-latest
            artifact: ReAudio-*.exe
            name: windows
          - os: macos-latest
            artifact: ReAudio-*.dmg
            name: macos

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Build Electron VST3 plugin
        run: pnpm --filter @reaudio/electron-vst dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-vst3-${{ matrix.name }}
          path: packages/electron-vst/dist/
          retention-days: 30

      - name: Upload installer/bundle
        uses: actions/upload-artifact@v4
        with:
          name: vst3-installer-${{ matrix.name }}
          path: packages/electron-vst/dist/*.{exe,dmg,AppImage}
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: vst3-installer-linux
          path: ./artifacts/linux

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: vst3-installer-windows
          path: ./artifacts/windows

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: vst3-installer-macos
          path: ./artifacts/macos

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux/*.AppImage
            artifacts/windows/*.exe
            artifacts/macos/*.dmg
          body: |
            # ReAudio VST3 Plugin Release

            Multi-platform native VST3 plugin distribution.

            ## Downloads

            - **Windows**: ReAudio-*.exe (Installer)
            - **macOS**: ReAudio-*.dmg (Installer)
            - **Linux**: ReAudio-*.AppImage (Portable)

            ## Installation

            ### Windows
            Run the `.exe` installer and follow the setup wizard.
            Plugin location: `C:\Program Files\Common Files\VST3\`

            ### macOS
            Open the `.dmg` file and drag ReAudio to Applications.
            Plugin location: `~/Library/Audio/Plug-Ins/VST3/`

            ### Linux
            Run the `.AppImage` file or extract it.
            Plugin location: `~/.vst3/`

            ## Features

            - Native VST3 plugin wrapper
            - Web Audio API processing
            - Cross-platform compatibility
            - Real-time MIDI support
            - Low-latency audio processing

            ---
            Generated by [GitHub Actions](https://github.com/westbullyboi/ReAudio/actions)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
