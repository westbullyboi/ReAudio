name: Build VST Plugin

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'examples/demo-plugin/**'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/build-vst.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.0.0

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Build VST plugin (demo-plugin)
        run: pnpm --filter demo-plugin build

      - name: Package VST plugin
        run: pnpm build:vst

      - name: Upload VST artifact
        uses: actions/upload-artifact@v3
        with:
          name: vst-plugin
          path: dist/vst/
          retention-days: 30

      - name: Upload VST package
        if: success()
        uses: actions/upload-artifact@v3
        with:
          name: vst-package
          path: dist/*.zip
          retention-days: 30

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body: |
            VST Plugin Build

            This release contains the built VST plugin for ReAudio.
          draft: false
          prerelease: false

      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./examples/demo-plugin/dist/
          asset_name: vst-plugin-${{ github.ref_name }}.zip
          asset_content_type: application/zip
