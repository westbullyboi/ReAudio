name: Build VST Plugin

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.7

      - name: Setup Node.js
        uses: actions/setup-node@v4.0.4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.0.0
        with:
          version: 9.0.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Build VST plugin (demo-plugin)
        run: pnpm --filter demo-plugin build

      - name: Package VST plugin
        run: node scripts/package-vst.js || true

      - name: Upload VST artifact
        uses: actions/upload-artifact@v4
        with:
          name: vst-plugin
          path: examples/demo-plugin/dist/
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            examples/demo-plugin/dist/*
            dist/*.zip
          body: |
            ReAudio Web VST Plugin Release

            Automated release generated by GitHub Actions workflow for tag `${{ github.ref_name }}`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
